<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workafella Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e3e2e0",
                        "outline-variant": "#c4c7c7",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "tertiary": "#000000",
                        "secondary-fixed-dim": "#fdbb12",
                        "surface": "#faf9f7",
                        "outline": "#747878",
                        "surface-container-highest": "#e3e2e0",
                        "surface-container-low": "#f4f3f1",
                        "surface-bright": "#faf9f7",
                        "primary": "#000000",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fdbb12",
                        "on-tertiary-fixed": "#3b0900",
                        "surface-dim": "#dadad8",
                        "primary-container": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#3b0900",
                        "inverse-on-surface": "#f1f1ef",
                        "on-tertiary-fixed-variant": "#882000",
                        "surface-container": "#efeeec",
                        "primary-fixed-dim": "#c8c6c5",
                        "surface-container-high": "#e9e8e6",
                        "secondary-fixed": "#ffdea4",
                        "inverse-primary": "#c8c6c5",
                        "on-background": "#1a1c1b",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#858383",
                        "on-secondary-fixed-variant": "#5d4200",
                        "secondary": "#7b5900",
                        "on-primary-fixed": "#1c1b1b",
                        "on-primary-fixed-variant": "#474746",
                        "background": "#faf9f7",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#5f5e5e",
                        "on-secondary-container": "#6c4d00",
                        "on-secondary-fixed": "#261900",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2f3130",
                        "on-surface-variant": "#444748",
                        "on-surface": "#1a1c1b",
                        "tertiary-fixed-dim": "#ffb5a1",
                        "on-tertiary-container": "#e65127",
                        "tertiary-fixed": "#ffdbd1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#e5e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "none": "0px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-sm": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "display-md": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "kpi-metric": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-md": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "kpi-metric": ["40px", { "lineHeight": "1", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .input-cascade:focus + .cascade-triangle {
            opacity: 1;
        }
    </style>
</head>
<body class="h-full bg-background font-body-md text-on-background selection:bg-secondary-container selection:text-primary overflow-hidden">
<div class="flex h-full w-full">
<!-- Left Panel: Photography & Branding -->
<div class="relative hidden md:flex md:w-1/2 h-full flex-col justify-between">
<!-- Background Image -->
<div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg');"></div>
<!-- Scrim -->
<div class="absolute inset-0 z-10 bg-gradient-to-t from-primary/80 via-primary/20 to-transparent"></div>
<!-- Top Left Logo -->
<div class="relative z-20 pt-margin-desktop pl-margin-desktop flex items-center gap-3">
<!-- Cascade Mark -->
<div class="w-8 h-8 flex flex-col justify-between items-start">
<div class="w-8 h-[2px] bg-secondary-container"></div>
<div class="w-6 h-[2px] bg-secondary-container"></div>
<div class="w-4 h-[2px] bg-secondary-container"></div>
</div>
<span class="font-display-md text-display-md text-on-primary">Workafella</span>
</div>
<!-- Bottom Content -->
<div class="relative z-20 pb-margin-desktop px-margin-desktop w-full flex justify-between items-end">
<div>
<!-- Index -->
<span class="block text-on-primary/70 font-label-caps text-label-caps mb-4">01 / 04</span>
<!-- Headline -->
<h1 class="font-display-lg text-display-lg text-on-primary leading-none tracking-tight">Move In.<br/>Move Up.</h1>
</div>
<!-- Circular Gold Button -->
<button class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center hover:scale-105 transition-transform duration-300 group">
<span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
<!-- Right Panel: Login Form -->
<div class="w-full md:w-1/2 h-full flex items-center justify-center bg-background px-margin-mobile md:px-0">
<div class="w-full max-w-[420px]">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="md:hidden flex items-center gap-3 mb-12">
<div class="w-8 h-8 flex flex-col justify-between items-start">
<div class="w-8 h-[2px] bg-secondary-container"></div>
<div class="w-6 h-[2px] bg-secondary-container"></div>
<div class="w-4 h-[2px] bg-secondary-container"></div>
</div>
<span class="font-display-md text-display-md text-primary">Workafella</span>
</div>
<div class="mb-10">
<h2 class="font-display-md text-display-md text-primary mb-2">Welcome back</h2>
<p class="font-body-md text-body-md text-outline">Enter your credentials to access your portal.</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-primary mb-2" for="email">Email Address</label>
<div class="relative">
<input class="input-cascade w-full bg-transparent border-t-0 border-l-0 border-r-0 border-b border-[#3A3A3A] focus:border-secondary-container focus:ring-0 px-0 py-3 font-body-md text-body-md text-primary transition-colors peer rounded-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
<!-- Focus Triangle -->
<div class="cascade-triangle absolute top-0 left-0 w-0 h-0 border-t-[6px] border-t-secondary-container border-r-[6px] border-r-transparent opacity-0 transition-opacity pointer-events-none"></div>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-primary mb-2" for="password">Password</label>
<div class="relative">
<input class="input-cascade w-full bg-transparent border-t-0 border-l-0 border-r-0 border-b border-[#3A3A3A] focus:border-secondary-container focus:ring-0 px-0 py-3 font-body-md text-body-md text-primary transition-colors peer rounded-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Focus Triangle -->
<div class="cascade-triangle absolute top-0 left-0 w-0 h-0 border-t-[6px] border-t-secondary-container border-r-[6px] border-r-transparent opacity-0 transition-opacity pointer-events-none"></div>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 border border-[#3A3A3A] group-hover:border-secondary-container transition-colors rounded-none">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity absolute">check</span>
</div>
<span class="font-body-sm text-body-sm text-[#161616]">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-[#161616] hover:text-secondary-container transition-colors underline decoration-1 underline-offset-4" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary-container text-[#161616] font-headline-sm text-body-md py-4 mt-8 hover:bg-[#161616] hover:text-secondary-container transition-colors duration-300 rounded-none relative group overflow-hidden" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                            Sign in
                            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<!-- Cascade Clip Accent -->
<div class="absolute top-0 right-0 w-0 h-0 border-t-[16px] border-t-background border-l-[16px] border-l-transparent group-hover:border-t-surface transition-colors"></div>
</button>
</form>
<!-- Footer Note -->
<div class="mt-12 pt-6 border-t border-[#3A3A3A]/20">
<p class="font-body-sm text-body-sm text-[#3A3A3A] flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">security</span>
                        MFA may be required for admin and finance roles.
                    </p>
</div>
</div>
</div>
</div>
</body></html>
