<style>
        .clip-tr {
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
        }
        .cascade-triangle {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 12px 12px;
        }
        .cascade-triangle.filled {
            border-color: transparent transparent #F5B400 transparent;
        }
        .cascade-triangle.outline {
            border-color: transparent transparent transparent transparent;
            position: relative;
        }
        .cascade-triangle.outline::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -11px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 10px 10px;
            border-color: transparent transparent #FAF9F7 transparent;
            z-index: 1;
        }
         .cascade-triangle.outline::before {
            content: '';
            position: absolute;
            top: 0;
            left: -12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 12px 12px;
            border-color: transparent transparent #3A3A3A transparent;
            z-index: 0;
        }
        .lattice-bg {
            background-image: radial-gradient(#F5B400 1px, transparent 0);
            background-size: 24px 24px;
            opacity: 0.05;
        }
    </style>

<body class="bg-background text-on-background font-body-md h-screen w-full relative overflow-hidden">
<!-- Blurred Background Context -->
<div class="absolute inset-0 z-0">
<img alt="Meeting Room Booking Background" class="w-full h-full object-cover filter blur-md opacity-80 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyB571io7qxdUHIN8fjhqnAXOuAl6iL-rX4p6tsZd2--kMOqCoHq6z0zpe-Jr8WQ_uUou5eQLalxaE56BwA4hppEILZlbgFS3BDUu2XnO82P9vo0j5URK0PBqpEui1A_T2rHigGCOZBLrWNBoA-l4O306Ysgx6RXh6mBIobbNMMoffP4kSImU7OaEl_Lwokcr0enuM9MJXXHTNQAzbBI4nAdsgMF23rc_1II2tlX2Xt2nT7nXyj_B8ow"/>
<div class="absolute inset-0 bg-background/60 backdrop-blur-sm"></div>
</div>
<!-- Modal Container -->
<div class="relative z-50 flex items-center justify-center w-full h-full p-margin-mobile md:p-0">
<!-- The Modal -->
<div class="bg-surface w-full max-w-lg border border-charcoal clip-tr relative flex flex-col shadow-2xl">
<!-- Decorative Lattice Background -->
<div class="absolute inset-0 lattice-bg pointer-events-none"></div>
<div class="p-8 md:p-10 relative z-10 flex flex-col gap-8">
<!-- Header -->
<div>
<h2 class="font-headline-sm text-headline-sm text-ink mb-2 tracking-tight">Confirm Your Booking</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-widest font-bold">Boardroom A</p>
</div>
<!-- Details Section -->
<div class="flex flex-col gap-4 border-l border-charcoal pl-6 ml-2 relative">
<div class="absolute -left-[5px] top-0 w-2 h-2 bg-charcoal rounded-none"></div>
<div class="absolute -left-[5px] bottom-0 w-2 h-2 bg-charcoal rounded-none"></div>
<div class="flex items-start gap-4">
<span class="material-symbols-outlined text-charcoal mt-0.5" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<div>
<p class="font-body-md text-body-md text-ink font-semibold">Oct 24, 2023</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">02:00 PM - 04:00 PM</p>
</div>
</div>
<div class="flex items-start gap-4">
<span class="material-symbols-outlined text-charcoal mt-0.5" style="font-variation-settings: 'FILL' 0;">group</span>
<div>
<p class="font-body-md text-body-md text-ink font-semibold">8 Attendees</p>
</div>
</div>
</div>
<!-- Cascade Countdown & Usage -->
<div class="bg-surface-container-low border border-charcoal p-6 flex flex-col gap-6">
<!-- Countdown -->
<div class="flex items-center justify-between">
<div class="flex flex-col gap-2">
<span class="font-kpi-metric text-headline-sm text-ink tracking-tighter">4:32</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Your slot is held — confirm before it expires</span>
</div>
<!-- The Cascade Visualization -->
<div class="flex items-end gap-1 translate-y-[-4px]">
<div class="cascade-triangle filled"></div>
<div class="cascade-triangle filled transform translate-x-[2px] -translate-y-[2px]"></div>
<div class="cascade-triangle filled transform translate-x-[4px] -translate-y-[4px]"></div>
<div class="cascade-triangle filled transform translate-x-[6px] -translate-y-[6px]"></div>
<div class="cascade-triangle outline transform translate-x-[8px] -translate-y-[8px]"></div>
</div>
</div>
<hr class="border-charcoal opacity-20"/>
<!-- Usage Breakdown -->
<ul class="flex flex-col gap-2 font-body-sm text-body-sm">
<li class="flex justify-between items-center text-ink">
<span>Free entitlement used</span>
<span class="font-semibold">2 hrs</span>
</li>
<li class="flex justify-between items-center text-on-surface-variant">
<span>Billable</span>
<span>0 hrs</span>
</li>
</ul>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-signature-gold text-ink font-label-caps text-label-caps py-4 px-8 border border-charcoal hover:bg-secondary-container transition-colors uppercase tracking-widest flex items-center justify-center gap-2 group">
                        Confirm Booking

</button>
<button class="w-full text-center font-body-sm text-body-sm text-charcoal underline hover:text-ink transition-colors pb-2">
                        Release hold
                    </button>
</div>
</div>
</div>
</div>
